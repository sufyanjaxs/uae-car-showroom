apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-showroom-backend
  namespace: car-showroom
  labels:
    app: car-showroom
    tier: backend
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: car-showroom
      tier: backend
  template:
    metadata:
      labels:
        app: car-showroom
        tier: backend
    spec:
      containers:
      - name: backend
        image: ${DOCKER_REGISTRY}/car-showroom-backend:${IMAGE_TAG}
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: car-showroom-secrets
              key: database-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: car-showroom-secrets
              key: redis-url
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: car-showroom-secrets
              key: secret-key
        - name: ENVIRONMENT
          value: "production"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: car-showroom
spec:
  selector:
    app: car-showroom
    tier: backend
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
